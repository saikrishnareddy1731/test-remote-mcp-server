[project]
name = "expense-tracker-mcp-server"
version = "1.0.0"
description = "A typed SQLite expense-tracker MCP server built with FastMCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.0.11,<5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
